version: "3"

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html
    ports:
      - "80:80"
    
    depends_on:
       - backend
    
    networks:
      - appnet

  backend:
    networks:
      - appnet
  
  frontend:
    build: ./frontend
    networks:
      - appnet

networks:
  appnet:
